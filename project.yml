name: Lumora
options:
  bundleIdPrefix: com.balasinoss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    # Metal-based Core Image kernels
    MTL_COMPILER_FLAGS: "-fcikernel"
    MTLLINKER_FLAGS: "-cikernel"
targets:
  Lumora:
    type: application
    platform: iOS
    sources:
      - path: Lumora
        excludes:
          - "Resources/LensfunDB"
          - "*.entitlements"
      - path: Lumora/Resources/LensfunDB
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balasinoss.lumora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Lumora/Info.plist
      properties:
        CFBundleDisplayName: Lumora
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Lumora saves your edited photos to your photo library.
        NSPhotoLibraryUsageDescription: Lumora imports photos from your library for editing.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.balasinoss.lumora.sort
    dependencies:
      - target: LumoraWidget
        embed: true
        codeSign: false
  LumoraWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LumoraWidget
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balasinoss.lumora.widget
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_KEY_CFBundleDisplayName: Lumora Picks
    info:
      path: LumoraWidget/Info.plist
      properties:
        CFBundleDisplayName: Lumora Picks
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
