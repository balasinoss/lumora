name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Fetch Lensfun lens database (CC BY-SA 3.0)
        run: |
          git clone --depth 1 https://github.com/lensfun/lensfun.git /tmp/lensfun
          mkdir -p Lumora/Resources/LensfunDB
          cp /tmp/lensfun/data/db/*.xml Lumora/Resources/LensfunDB/
          ls Lumora/Resources/LensfunDB | wc -l

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            Lumora/Models
            ~/.lumora-model-cache
          key: models-v1-${{ hashFiles('scripts/convert_models.py') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build AI models (Denoise, Sky, MobileCLIP)
        run: |
          if [ ! -d Lumora/Models/Denoiser.mlpackage ] || [ ! -d Lumora/Models/SkySegmenter.mlpackage ] || [ ! -d Lumora/Models/ClipText.mlpackage ]; then
            pip install -q "torch==2.4.1" "coremltools==8.1" "transformers==4.44.2" "huggingface_hub>=0.24" "numpy<2" 2>&1 | tail -3
            python scripts/convert_models.py Lumora/Models 2>&1 | tee models.log
          fi
          ls -la Lumora/Models

      - name: Generate app icon
        run: python3 scripts/make_icon.py Lumora/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumora.xcodeproj \
            -scheme Lumora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD" build.log | head -50 || true
          test -f build/Build/Products/Release-iphoneos/Lumora.app/Lumora

      - name: Report build errors as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Commit: ${GITHUB_SHA}"
            echo '```'
            grep -E "error:|fatal error|Undefined symbol|ld:" build.log | sort -u | head -150 || true
            echo '```'
            echo 'Models:'
            echo '```'
            tail -40 models.log 2>/dev/null || true
            echo '```'
            echo '<details><summary>Log tail</summary>'
            echo ''
            echo '```'
            tail -80 build.log || true
            echo '```'
            echo '</details>'
          } > errors.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file errors.md --label "" || gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file errors.md

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumora.app Payload/
          zip -qry Lumora.ipa Payload
          ls -lh Lumora.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lumora-ipa
          path: Lumora.ipa

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Lumora.ipa \
            --title "Lumora (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Lumora.ipa and install it with Sideloadly."
